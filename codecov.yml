# Coverage is reported but never blocks a build. Marking both status checks
# "informational" means they still post the coverage delta and show up on the
# PR, but always resolve as passing. Without this, Codecov's defaults make
# project and patch blocking, so routine changes that shift coverage slightly
# (dependency bumps, refactors) fail the build on their own.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# require_changes: false keeps the report comment posting even when coverage
# is unchanged.
comment:
  layout: "reach, diff, flags, files"
  require_changes: false
